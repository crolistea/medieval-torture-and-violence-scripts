name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Do not include API keys, private prompts, or other secrets.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Medieval module, Action Variety, Escalation Engine, website, Prompt Inspector...

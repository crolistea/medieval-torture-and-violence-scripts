name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Lets the workflow publish to GitHub Pages using a short-lived OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the running deployment
# to finish instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Reports the path GitHub Pages serves this site from (/<repository-name>).
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # Runs the TypeScript checks, then builds the site into ./dist.
      - name: Build website
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
